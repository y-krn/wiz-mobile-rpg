# Codex environment setup for wiz-mobile-rpg.
# Keep setup idempotent and non-destructive.
version = 1
name = "wiz-mobile-rpg"

[setup]
script = '''
set -eu

git fetch origin main

# Worktree作成時に変更が持ち込まれていたら中止
if [ -n "$(git status --porcelain)" ]; then
  echo "Worktree is not clean; aborting"
  exit 1
fi

# cleanなWorktreeだけを fast-forward 可能な場合に最新のorigin/mainへ移動
git merge --ff-only origin/main

echo "Worktree is now based on:"
git rev-parse --short HEAD'''
