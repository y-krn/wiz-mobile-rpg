version = 1
name = "wiz-mobile-rpg"

[setup]
script = '''
set -eu

git fetch origin main

# Worktree作成時に変更が持ち込まれていたら中止
if [ -n "$(git status --porcelain)" ]; then
  echo "Worktree is not clean; aborting"
  exit 1
fi

# このWorktreeだけを最新のorigin/mainへ移動
git reset --hard origin/main

echo "Worktree is now based on:"
git rev-parse --short HEAD'''
