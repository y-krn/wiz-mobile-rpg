<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DEPTHWARD" />
    <meta name="description" content="より深く。何かを持ち帰るために。" />
    <meta name="theme-color" content="#fffaf1" />
    <!-- PWA manifest & app icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="google-site-verification" content="-NlBrfHCXojEd6yPaPd9aLFBRZxXmvqD-yn1B4adm80" />
    <title>DEPTHWARD</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-container">
      <!-- Top HUD -->
      <header id="game-header" class="minimal-hud" data-shell-region="minimal-hud" aria-label="状態">
        <span id="location-label">リルガミンの街</span>
        <button id="btn-mute" class="btn btn-mute sound-on" title="ミュート切替" aria-label="音声設定">🎵 ON</button>
      </header>

      <section id="pwa-update-banner" class="pwa-update-banner" role="status" aria-live="polite" hidden>
        <span>更新を適用できます。</span>
        <button id="btn-pwa-apply-update" class="btn btn-neon" type="button">更新して再読み込み</button>
      </section>

      <!-- Goal HUD -->
      <div id="goal-banner">
        <!-- Will be populated dynamically in ui.js -->
      </div>
      <div id="floor-entry-stinger" class="floor-entry-stinger" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- 3D Canvas viewport -->
      <div id="viewport-panel" class="dungeon-view" data-shell-region="dungeon-view" aria-label="迷宮の視界">
        <canvas id="dungeon-canvas"></canvas>
        <canvas id="dungeon-minimap-overlay" aria-hidden="true"></canvas>
        <div id="minimap-toggle-root" class="minimap-toggle-root"></div>
        <div id="records-strip" class="records-strip" aria-label="潜行記録"></div>
        <!-- Text HUD representation of surrounding walls for accessibility & navigation -->
        <div id="viewport-hud" aria-live="polite"></div>
        <div id="result-overlay" class="result-overlay-container" role="dialog" aria-modal="true" aria-label="冒険結果" style="display: none;"></div>
      </div>

      <!-- Equip overlay (moved outside viewport for full game area layout) -->
      <div id="equip-overlay" class="equip-overlay-container" role="dialog" aria-modal="true" aria-label="装備とバッグ" style="display: none;"></div>

      <!-- Spell overlay (moved outside viewport for full game area layout) -->
      <div id="spell-overlay" class="spell-overlay-container" role="dialog" aria-modal="true" aria-label="呪文選択" style="display: none;"></div>

      <!-- Archives overlay -->
      <div id="archives-overlay" class="archives-overlay-container is-hidden"></div>

      <!-- Log Messages -->
      <div id="log-panel" class="current-event-strip" data-shell-region="current-event-strip" role="region" aria-label="現在の出来事">
        <button id="btn-log-expand" title="全ログを表示" aria-label="全ログを表示">⛶</button>
        <div id="log-content" aria-live="polite" aria-atomic="false"></div>
      </div>

      <!-- Full-log overlay (expanded from #btn-log-expand) -->
      <div id="log-overlay" class="log-overlay-container" role="dialog" aria-modal="true" aria-label="冒険の記録" style="display: none;">
        <div class="log-overlay-header">
          <span class="log-overlay-title">冒険の記録</span>
          <button id="btn-log-overlay-close" class="btn btn-neon">閉じる</button>
        </div>
        <div id="log-overlay-body" class="log-overlay-body"></div>
      </div>

      <!-- Full-floor map (opened from #btn-minimap-toggle, #1833) -->
      <div id="full-map-overlay-root"></div>

      <!-- Controls Panel (Grid) -->
      <div id="controls-panel" class="action-dock" data-shell-region="action-dock" data-dock-state="compact" aria-label="操作">
        <!-- Explortaion D-pad controls (shown in explore mode) -->
        <div id="explore-controls" class="controls-group active">
          <div class="dpad" data-assistive-pad aria-label="移動（キーボード・支援技術用）">
            <button id="btn-turn-around" class="btn btn-neon btn-dpad" title="後ろを向く (Q)" aria-label="後ろを向く">反転</button>
            <button id="btn-move-forward" class="btn btn-neon btn-dpad" title="前進" aria-label="前進" data-primary-action="forward">進む</button>
            <button id="btn-turn-left" class="btn btn-neon btn-dpad" title="左を向く" aria-label="左を向く">◀</button>
            <button id="btn-move-backward" class="btn btn-neon btn-dpad" title="後退" aria-label="後退">▼</button>
            <button id="btn-turn-right" class="btn btn-neon btn-dpad" title="右を向く" aria-label="右を向く">▶</button>
          </div>
          <div id="explore-satchel" class="action-grid" aria-label="持ち物袋">
            <button id="btn-search" class="btn btn-neon btn-action" title="調べる" aria-label="調べる">調べる</button>
            <button id="btn-inspect" class="btn btn-neon btn-action" aria-label="バッグ">バッグ</button>
            <button id="btn-cast" class="btn btn-neon btn-action" aria-label="魔法">魔法</button>
            <button id="btn-item" class="btn btn-neon btn-action">装備</button>
            <button id="btn-explore-management" class="btn btn-neon btn-action">冒険管理</button>
          </div>
        </div>

        <!-- Combat controls (shown in combat mode) -->
        <div id="combat-controls" class="controls-group">
          <div id="combat-prompt" role="status" aria-live="polite">行動を選択してください</div>
          <div class="combat-grid">
            <button id="btn-combat-fight" class="btn btn-neon btn-combat" data-command-tier="primary" aria-label="攻撃。敵を選択">攻撃</button>
            <!-- Build vNext weapon technique; only shown when the equipped weapon owns one. -->
            <button id="btn-combat-technique" class="btn btn-neon btn-combat" data-command-tier="secondary" hidden>技</button>
            <button id="btn-combat-spell" class="btn btn-neon btn-combat" data-command-tier="secondary">魔法</button>
            <button id="btn-combat-item" class="btn btn-neon btn-combat" data-command-tier="secondary">道具</button>
            <button id="btn-combat-repeat" class="btn btn-neon btn-combat" aria-label="前回の行動を1ターン再実行" disabled>くり返す</button>
            <!-- Kept as a compatibility hook for saved/test state; Auto is not a visible combat action. -->
            <button id="btn-combat-auto" class="btn btn-neon btn-combat" hidden aria-hidden="true">オート</button>
            <button id="btn-combat-defend" class="btn btn-neon btn-combat" data-command-tier="secondary">防御</button>
            <button id="btn-combat-run" class="btn btn-neon btn-combat" data-command-tier="secondary">逃走</button>
            <button id="btn-combat-cancel" class="btn btn-neon btn-combat dock-action-back" data-action-role="back">キャンセル</button>
          </div>
        </div>

        <!-- Town controls (shown in town mode) -->
        <div id="town-controls" class="controls-group">
          <div class="town-grid" data-town-home>
            <section class="town-home-section town-home-last-run" aria-labelledby="town-last-run-title">
              <div class="town-home-section-heading">
                <span class="town-home-kicker">前回の冒険</span>
                <h2 id="town-last-run-title">記憶へ定着した出来事</h2>
              </div>
              <div id="town-last-run-summary" class="town-last-run-summary" aria-live="polite"></div>
              <button id="btn-town-castle" class="btn btn-neon btn-town">
                <strong data-town-castle-label>冒険記録を見る</strong><span data-town-castle-detail>おしろ — 何が起きたか</span>
              </button>
            </section>

            <section class="town-home-section" aria-labelledby="town-next-run-title">
              <div class="town-home-section-heading">
                <span class="town-home-kicker">次の潜行</span>
                <h2 id="town-next-run-title">あと少しで届く偉業</h2>
              </div>
              <div id="town-feat-summary" class="town-feat-summary" aria-live="polite"></div>
              <div class="town-home-actions">
                <button id="btn-town-feats" class="btn btn-neon btn-town">
                  <strong>偉業の一覧を見る</strong><span data-town-feats-detail>条件と進み具合</span>
                </button>
              </div>
            </section>

            <section class="town-home-section" aria-labelledby="town-memory-title">
              <div class="town-home-section-heading">
                <span class="town-home-kicker">蓄積した記録</span>
                <h2 id="town-memory-title">迷宮から得た知識と可能性</h2>
              </div>
              <div class="town-home-actions">
                <button id="btn-town-archives" class="btn btn-neon btn-town">
                  <strong>迷宮について分かったこと</strong><span>書庫 — Codex</span>
                </button>
                <button id="btn-town-workshop" class="btn btn-neon btn-town">
                  <strong>広がった可能性を見る</strong><span>工房 — Workshop</span>
                </button>
              </div>
            </section>
          </div>
          <!-- The next-run preparation stays pinned to the bottom of the town scroll. -->
          <div class="town-primary-dock">
            <button id="btn-town-dungeon" class="btn btn-neon btn-town" aria-describedby="town-next-run-title">
              <strong>準備を整える</strong><span>開始キットと開始地点を選ぶ</span>
            </button>
          </div>
        </div>

        <!-- Camp/Sub-menu controls (shown when in sub-menu) -->
        <div id="submenu-controls" class="controls-group">
          <div id="submenu-title">メニュー</div>
          <div id="submenu-options" class="submenu-grid">
            <!-- Dynamically populated buttons -->
          </div>
          <div id="departure-start-footer" aria-label="出発の確定"></div>
          <div id="merchant-confirm-footer" aria-label="商人の確定操作"></div>
          <button id="btn-submenu-back" class="btn btn-secondary btn-block dock-action-back" data-action-role="back">戻る</button>
        </div>

        <!-- Combat target/spell/item choices use the same Action Dock surface. -->
        <div id="combat-overlay" class="combat-overlay-container" role="dialog" aria-modal="true" aria-label="戦闘の選択" style="display: none;"></div>

        <!-- Trap controls (shown in trap encounter) -->
        <div id="trap-controls" class="controls-group">
          <div id="trap-info">
            <div id="trap-header">⚠️ 罠に遭遇！</div>
            <div id="trap-route-hint">発見済みの罠は地図に表示されています。避ける場合は、罠へ進まず通常移動で別の道を選んでください。</div>
            <div id="trap-details">
              <div id="trap-name">罠名: -</div>
              <div id="trap-status">状態: -</div>
              <div id="trap-difficulty">危険度: -</div>
              <div id="trap-effect">予想効果: -</div>
              <div id="trap-success-rate">解除成功率: -</div>
            </div>
          </div>
          <div class="trap-grid">
            <button id="btn-trap-disarm" class="btn btn-neon btn-trap" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">解除する</button>
            <button id="btn-trap-force" class="btn btn-danger btn-trap">強行突破</button>
          </div>
        </div>
      </div>

      <!-- Solo character HUD (Bottom) -->
      <footer id="character-panel" data-shell-region="minimal-hud" aria-label="冒険者の状態">
        <div id="character-hud"></div>
      </footer>
    </div>

    <!-- Script Entry -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
