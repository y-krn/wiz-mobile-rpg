name: Issue 1143 path migration

on:
  push:
    branches:
      - codex/issue-1143

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1143
          fetch-depth: 0

      - name: Rewrite moved test paths
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')
          node_tests = repo / 'tests' / 'node'

          for path in node_tests.rglob('*.js'):
              text = path.read_text()
              updated = (text
                  .replace('../../simulations', '../../../scratch/simulations')
                  .replace('../../measurements', '../../../scratch/measurements')
                  .replace('../../benchmarks', '../../../scratch/benchmarks'))
              if updated != text:
                  path.write_text(updated)

          allowed_suffixes = {'.md', '.js', '.json', '.yml', '.yaml', '.toml'}
          excluded_roots = {'evidence', '.git', 'node_modules', 'dist'}
          for path in repo.rglob('*'):
              if not path.is_file() or path.suffix not in allowed_suffixes:
                  continue
              if any(part in excluded_roots for part in path.parts):
                  continue
              text = path.read_text(errors='strict')
              updated = text.replace('scratch/tests/', 'tests/node/')
              if updated != text:
                  path.write_text(updated)

          stale_relative = []
          for path in node_tests.rglob('*.js'):
              text = path.read_text()
              for token in ('../../simulations', '../../measurements', '../../benchmarks'):
                  if token in text:
                      stale_relative.append(f'{path}: {token}')
          if stale_relative:
              raise SystemExit('stale moved-test relative paths:\n' + '\n'.join(stale_relative))
          PY

      - name: Commit migration and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-1143-path-migration.yml
          git add tests/node .agents scripts .github package.json eslint.config.js scratch/README.md tests/README.md
          git commit -m "fix(tests): rewrite paths after ownership move (#1143)"
          git push origin HEAD:codex/issue-1143
