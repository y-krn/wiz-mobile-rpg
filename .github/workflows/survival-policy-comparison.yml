name: Survival policy comparison

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to measure"
        required: false
        default: "main"
        type: string
      runs:
        description: "Runs per starting-kit/Workshop/policy condition (minimum 1000)"
        required: false
        default: "1000"
        type: string
      seed:
        description: "Deterministic matched world-seed input"
        required: false
        default: "1277"
        type: string
      purpose:
        description: "Why this diagnostic is being requested"
        required: true
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run matched survival policy comparison
        env:
          MEASUREMENT_REPOSITORY: ${{ github.repository }}
          MEASUREMENT_REQUESTED_REF: ${{ inputs.ref }}
          MEASUREMENT_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MEASUREMENT_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEASUREMENT_RUN_TYPE: diagnostic
        run: |
          mkdir -p /tmp/survival-policy-comparison
          node scratch/measurements/measure_survival_policy_comparison.js \
            --ref "${{ inputs.ref }}" \
            --runs "${{ inputs.runs }}" \
            --seed "${{ inputs.seed }}" \
            --purpose "${{ inputs.purpose }}" \
            --output /tmp/survival-policy-comparison/measurement.json \
            --summary /tmp/survival-policy-comparison/measurement.md \
            --manifest /tmp/survival-policy-comparison/manifest.json
      - name: Publish comparison summary
        if: always()
        run: cat /tmp/survival-policy-comparison/measurement.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish machine-readable manifest
        if: always()
        run: |
          printf '\n### Machine-readable manifest\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/survival-policy-comparison/manifest.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survival-policy-comparison-${{ github.run_id }}
          path: |
            /tmp/survival-policy-comparison/measurement.json
            /tmp/survival-policy-comparison/measurement.md
            /tmp/survival-policy-comparison/manifest.json
          if-no-files-found: error
          retention-days: 90
