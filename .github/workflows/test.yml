name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      debug_raw:
        description: "Retain raw, visual, diagnostic, and log evidence"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The simulation-follow gate compares the PR with origin/main.
          # Full history makes that base ref available in the actual PR job.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-deps
      - run: npm run test:unit:full
        env:
          PR_UNIT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '1' || '0' }}
          UNIT_MODE: ${{ github.event_name == 'pull_request' && 'pull-request' || github.event_name == 'merge_group' && 'merge-group' || github.event_name == 'push' && 'main-push' || 'local' }}
      - name: Verify measurement provenance
        run: node tests/node/regression/test_measurement_provenance.js

  unit-heavy-conditional:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-deps
      - run: npm run test:unit:conditional
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.sha }}

  unit-heavy-main-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-deps
      - run: npm run test:unit:main-push

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lint
        env:
          EVIDENCE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          EVIDENCE_HEAD_SHA: ${{ github.sha }}
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Detect browser changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            browser:
              - 'src/**'
              - 'tests/**/*.spec.js'
              - 'tests/**/*.cases.js'
              - 'tests/fixtures/**'
              - 'tests/*-helpers.js'
              - 'tests/*-fixtures.js'
              - 'tests/**/*-snapshots/**'
              - '**/*.css'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.js'
              - 'scripts/dependency-preflight.js'
              - 'scripts/playwright-diagnostics.js'
              - 'scripts/playwright-diagnostics-reporter.js'
              - 'scripts/playwright-preflight.js'
              - 'tests/node/regression/test_playwright_diagnostics.js'
              - '.github/actions/setup-node-deps/action.yml'
              - '.github/workflows/test.yml'
      - uses: ./.github/actions/setup-node-deps
        if: steps.changes.outputs.browser == 'true'
      - name: Resolve Playwright version
        id: pw
        if: steps.changes.outputs.browser == 'true'
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        if: steps.changes.outputs.browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.changes.outputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run browser smoke tests
        id: browser_test
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/browser-test.log"
        if: steps.changes.outputs.browser == 'true'
      - name: Run untagged browser tests
        id: browser_untagged_test
        run: |
          set -o pipefail
          npm run test:browser:untagged 2>&1 | tee "$RUNNER_TEMP/browser-untagged-test.log"
        if: steps.changes.outputs.browser == 'true'
      - name: Run treasure chest visual evidence
        id: treasure_chest_visual
        run: |
          set -o pipefail
          npx playwright test tests/ui-treasure-chest.spec.js --grep @visual 2>&1 | tee "$RUNNER_TEMP/treasure-chest-visual.log"
        if: steps.changes.outputs.browser == 'true'
      - name: Run dungeon world-object visual evidence
        id: dungeon_world_object_visual
        run: |
          set -o pipefail
          npx playwright test tests/ui-dungeon-world-objects-1417.spec.js tests/ui-dungeon-world-object-depth-1448.spec.js --grep @visual 2>&1 | tee "$RUNNER_TEMP/dungeon-world-object-visual.log"
        if: steps.changes.outputs.browser == 'true'
      - name: Run browser debug visual evidence
        id: browser_visual
        run: |
          set -o pipefail
          npx playwright test --grep @visual 2>&1 | tee "$RUNNER_TEMP/browser-visual.log"
        if: always() && steps.changes.outputs.browser == 'true' && inputs.debug_raw == true
      - name: Stage CI evidence artifact
        id: evidence
        if: always() && steps.changes.outputs.browser == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          EVIDENCE_CONFIG: ${{ toJSON(inputs) }}
        run: |
          stage_args=(
            --staging-dir "$RUNNER_TEMP"
            --status "${{ steps.browser_untagged_test.outcome }}"
            --visual-dir test-results
            --visual-dir output/playwright
            --diagnostics-dir playwright-report
            --logs "$RUNNER_TEMP/browser-test.log"
            --logs "$RUNNER_TEMP/browser-untagged-test.log"
            --logs "$RUNNER_TEMP/treasure-chest-visual.log"
            --logs "$RUNNER_TEMP/dungeon-world-object-visual.log"
            --logs "$RUNNER_TEMP/browser-visual.log"
            --github-output "$GITHUB_OUTPUT"
          )
          stage_args+=(--include-raw --raw test-results)
          stage_args+=(--raw output/playwright/issue-1539)
          node scripts/stage_evidence_artifact.js "${stage_args[@]}"
      - name: Upload CI evidence artifact
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ steps.evidence.outputs.artifact_dir }}
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
