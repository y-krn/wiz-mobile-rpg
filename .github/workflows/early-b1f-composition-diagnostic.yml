name: Early B1F composition diagnostic

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to measure"
        required: false
        default: "main"
        type: string
      runs:
        description: "Matched holdout run-level cases (minimum 1000)"
        required: false
        default: "1000"
        type: string
      selection_runs:
        description: "Target-profile selection runs (minimum 5000)"
        required: false
        default: "5000"
        type: string
      fixed_runs:
        description: "Fixed panel runs per pair × HP band × policy (minimum 1000)"
        required: false
        default: "1000"
        type: string
      seed:
        description: "Matched holdout run-level seed"
        required: false
        default: "2192"
        type: string
      selection_seed:
        description: "Independent target-profile selection seed"
        required: false
        default: "1192"
        type: string
      fixed_seed:
        description: "Matched fixed-combat seed"
        required: false
        default: "1151"
        type: string
      purpose:
        description: "Why this measurement is being requested"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run early B1F composition diagnostic
        env:
          MEASUREMENT_REPOSITORY: ${{ github.repository }}
          MEASUREMENT_REQUESTED_REF: ${{ inputs.ref }}
          MEASUREMENT_REQUESTED_RUNS: ${{ inputs.runs }}
          MEASUREMENT_REQUESTED_SELECTION_RUNS: ${{ inputs.selection_runs }}
          MEASUREMENT_REQUESTED_FIXED_RUNS: ${{ inputs.fixed_runs }}
          MEASUREMENT_REQUESTED_SEED: ${{ inputs.seed }}
          MEASUREMENT_REQUESTED_SELECTION_SEED: ${{ inputs.selection_seed }}
          MEASUREMENT_REQUESTED_FIXED_SEED: ${{ inputs.fixed_seed }}
          MEASUREMENT_PURPOSE: ${{ inputs.purpose }}
          MEASUREMENT_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MEASUREMENT_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p /tmp/early-b1f-composition-diagnostic
          node scratch/measurements/early_b1f_composition_diagnostic.js \
            --ref "$MEASUREMENT_REQUESTED_REF" \
            --runs "$MEASUREMENT_REQUESTED_RUNS" \
            --selection-runs "$MEASUREMENT_REQUESTED_SELECTION_RUNS" \
            --fixed-runs "$MEASUREMENT_REQUESTED_FIXED_RUNS" \
            --seed "$MEASUREMENT_REQUESTED_SEED" \
            --selection-seed "$MEASUREMENT_REQUESTED_SELECTION_SEED" \
            --fixed-seed "$MEASUREMENT_REQUESTED_FIXED_SEED" \
            --purpose "$MEASUREMENT_PURPOSE" \
            --output /tmp/early-b1f-composition-diagnostic/report.json \
            --summary /tmp/early-b1f-composition-diagnostic/summary.md \
            --manifest /tmp/early-b1f-composition-diagnostic/manifest.json
      - name: Publish diagnostic summary
        if: always()
        run: cat /tmp/early-b1f-composition-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-b1f-composition-diagnostic-${{ github.run_id }}
          path: |
            /tmp/early-b1f-composition-diagnostic/report.json
            /tmp/early-b1f-composition-diagnostic/summary.md
            /tmp/early-b1f-composition-diagnostic/manifest.json
          if-no-files-found: error
          retention-days: 90
