name: Early B1F composition diagnostic

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to measure"
        required: false
        default: "main"
        type: string
      runs:
        description: "Matched run-level cases (minimum 1000)"
        required: false
        default: "1000"
        type: string
      fixed_runs:
        description: "Fixed panel runs per pair × HP band × policy (minimum 1000)"
        required: false
        default: "1000"
        type: string
      seed:
        description: "Matched run-level seed"
        required: false
        default: "1192"
        type: string
      fixed_seed:
        description: "Matched fixed-combat seed"
        required: false
        default: "1151"
        type: string
      purpose:
        description: "Why this measurement is being requested"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run early B1F composition diagnostic
        env:
          MEASUREMENT_REPOSITORY: ${{ github.repository }}
          MEASUREMENT_REQUESTED_REF: ${{ inputs.ref }}
          MEASUREMENT_WORKFLOW_RUN_ID: ${{ github.run_id }}
          MEASUREMENT_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p /tmp/early-b1f-composition-diagnostic
          node scratch/measurements/early_b1f_composition_diagnostic.js \
            --ref "${{ inputs.ref }}" \
            --runs "${{ inputs.runs }}" \
            --fixed-runs "${{ inputs.fixed_runs }}" \
            --seed "${{ inputs.seed }}" \
            --fixed-seed "${{ inputs.fixed_seed }}" \
            --purpose "${{ inputs.purpose }}" \
            --output /tmp/early-b1f-composition-diagnostic/report.json \
            --summary /tmp/early-b1f-composition-diagnostic/summary.md \
            --manifest /tmp/early-b1f-composition-diagnostic/manifest.json
      - name: Publish diagnostic summary
        if: always()
        run: cat /tmp/early-b1f-composition-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-b1f-composition-diagnostic-${{ github.run_id }}
          path: |
            /tmp/early-b1f-composition-diagnostic/report.json
            /tmp/early-b1f-composition-diagnostic/summary.md
            /tmp/early-b1f-composition-diagnostic/manifest.json
          if-no-files-found: error
          retention-days: 90
