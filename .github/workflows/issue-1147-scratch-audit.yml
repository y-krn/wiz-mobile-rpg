name: Issue 1147 scratch lifecycle migration

on:
  push:
    branches:
      - codex/issue-1147

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1147
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply migration
        run: python scripts/migrate_issue_1147_scratch.py
      - run: npm ci
      - run: npm run test:unit:full
      - run: npm run lint
      - name: Commit migration
        run: |
          git checkout -- evidence || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo "migration already applied"
            exit 0
          fi
          git commit -m "chore(scratch): retire Issue-numbered assets (#1147)"
          git push origin HEAD:codex/issue-1147
