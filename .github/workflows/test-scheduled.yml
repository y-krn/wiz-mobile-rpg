name: Scheduled tests

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

jobs:
  unit-heavy-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-node-deps
      - run: npm run test:unit:scheduled
